# Source: https://www.together.ai/models/gemini-flash-image-2-5 and https://docs.together.ai/docs/serverless-models#image-models (accessed 2026-10-29).
# $0.039 per image. Billed per image at the upstream provider's own charge; the price is Together's estimate and varies with resolution, quality and reference images (https://docs.together.ai/docs/serverless/overview#how-image-models-bill).
# Input: text only on Together (model page input modalities: Text). The images endpoint returns images only
# (no text) and takes no sampling parameters.
# Images: POST https://api.together.xyz/v1/images/generations; input images go in image_url or reference_images
# (https://docs.together.ai/reference/post-images-generations).
schema = 2
v2_only = true
base_model = "google/gemini-2.5-flash-image"

[modalities]
input = ["text"]
output = ["image/png", "image/jpeg"]

[capabilities]
temperature = false
top_p = false
top_k = false

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/togetherai/images" }

[cost.image.output]
unit = "image"
price = 0.039
