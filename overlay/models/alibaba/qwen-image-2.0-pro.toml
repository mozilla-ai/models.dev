# Released 2026-03-03 on Alibaba Cloud Model Studio (https://www.alibabacloud.com/help/en/model-studio/model-pricing,
# as recorded in providers/alibaba/models/qwen-image-2.0-pro.toml). Generation and editing in one model:
# https://www.alibabacloud.com/help/en/model-studio/image-model
# MIME types: input images JPG, JPEG, PNG, BMP, TIFF, WEBP or GIF; output PNG
# (https://www.alibabacloud.com/help/en/model-studio/qwen-image-edit-api).
schema = 2
v2_only = true
type = "image"
name = "Qwen Image 2.0 Pro"
description = "Higher-fidelity Qwen image model for generation and editing"
family = "qwen"
open_weights = false
release_date = "2026-03-03"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/bmp", "image/tiff", "image/webp", "image/gif"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
