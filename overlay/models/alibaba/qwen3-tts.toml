# Qwen3-TTS weights published 2026-01-21 (Apache-2.0): https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
# 10 languages, preset voices, voice cloning and natural-language instructions; output mp3, opus, flac, wav
#   or pcm as served by DeepInfra: https://api.deepinfra.com/models/Qwen/Qwen3-TTS (accessed 2026-11-10)
schema = 2
v2_only = true
type = "speech"
name = "Qwen3-TTS"
description = "Expressive multilingual text-to-speech model with preset voices and voice cloning in 10 languages"
family = "qwen"
open_weights = true
release_date = "2026-01-21"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/opus", "audio/flac", "audio/wav", "audio/pcm"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice"
