# Wan2.2 released 2025-07-28 (Apache-2.0): https://github.com/Wan-Video/Wan2.2 and
#   https://huggingface.co/Wan-AI/Wan2.2-T2V-A14B
# Text-to-video only, 5-second 720p clips at 16 fps, MoE with a high-noise and a low-noise expert.
schema = 2
v2_only = true
type = "video"
name = "Wan2.2 T2V A14B"
description = "Open 14B mixture-of-experts text-to-video model for 5-second 720p clips"
open_weights = true
release_date = "2025-07-28"
license = "Apache-2.0"

[modalities]
input = ["text"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Wan-AI/Wan2.2-T2V-A14B"
