# Listed on DeepInfra 2025-09-11 (create_ts of https://api.deepinfra.com/models/list, accessed 2026-11-10),
#   which is the release date used here; Bria publishes no dated release note for 3.2.
# Model page: https://deepinfra.com/Bria/Bria-3.2; parameters: https://api.deepinfra.com/models/Bria/Bria-3.2
# 4B-parameter text-to-image model trained on licensed data; weights on Hugging Face (gated):
#   https://huggingface.co/briaai/BRIA-3.2
schema = 2
v2_only = true
type = "image"
name = "Bria 3.2"
description = "Commercial-ready 4B text-to-image model with strong text rendering, trained on licensed data"
open_weights = true
release_date = "2025-09-11"

[modalities]
input = ["text"]
output = ["image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/briaai/BRIA-3.2"
