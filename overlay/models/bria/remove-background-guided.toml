# Model page: https://deepinfra.com/Bria/remove_background_guided; parameters: https://api.deepinfra.com/models/Bria/remove_background_guided
# Input image JPEG, PNG or WEBP with an optional prompt naming what stays or goes; output: PNG with alpha.
schema = 2
v2_only = true
type = "image"
name = "Guided Remove Background"
description = "Prompt-guided background removal that returns a transparent PNG at the original resolution"
open_weights = false
