# Amazon Titan Text Embeddings V2: https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
#   Up to 8,192 tokens or 50,000 characters in; 1,024 (default), 512 or 256 dimensions out. Optimized for
#   English, with 100+ languages in preview.
# Launch date: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-titan-text-embeddings-v2.html
schema = 2
v2_only = true
type = "embedding"
name = "Titan Text Embeddings V2"
description = "Text embedding model for retrieval, semantic similarity and clustering, with 256 to 1,024 dimensions"
family = "titan-embed"
open_weights = false
release_date = "2024-04-30"

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_192
output = 1_024
