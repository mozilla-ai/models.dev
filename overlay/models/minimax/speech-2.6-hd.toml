# Released 2025-10-29 (accessed 2026-11-18): https://platform.minimax.io/docs/release-notes/models lists 'Oct. 29, 2025: Released Speech 2.6'; news post dated 2025.10.30 says Speech 2.6 is fully live: https://www.minimax.io/news/minimax-speech-26 (the notes name no separate HD/Turbo dates, so both take the Speech 2.6 release date)
# Output formats (audio_setting.format mp3, pcm, flac, wav, pcmu_raw/pcmu_wav μ-law, opus; speech-2.6-hd is a listed model id): https://platform.minimax.io/docs/api-reference/speech-t2a-http
# Sampling: the T2A API has no temperature/top_p/top_k (only voice_setting speed, vol, pitch), same as the 2.8 files.
schema = 2
v2_only = true
type = "speech"
name = "Speech 2.6 HD"
description = "High-fidelity text-to-speech model"
family = "minimax"
open_weights = false
release_date = "2025-10-29"

[modalities]
input = ["text"]
output = ["audio/mpeg", "audio/pcm", "audio/flac", "audio/wav", "audio/basic", "audio/opus"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
