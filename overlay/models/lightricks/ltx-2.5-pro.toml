# LTX-2.5 released 2026-08-11 (open weights, 22B): https://github.com/Lightricks/LTX-2 releases and
#   https://huggingface.co/Lightricks (LTX-2.5-22b LoRA repositories from 2026-09). Pro is the hosted
#   higher-fidelity variant, so the weights flag is off here.
# Inputs (first and last frame PNG, JPEG or WebP), 16:9, 9:16, 1:1, 3:2 and 2:3 up to 4K, 24-50 fps, 6-10 s,
#   optional audio track: https://api.deepinfra.com/models/Lightricks/LTX-2.5-Pro (accessed 2026-11-10)
schema = 2
v2_only = true
type = "video"
name = "LTX-2.5 Pro"
description = "Higher-fidelity LTX-2.5 video model with native multi-shot scenes and synchronized audio up to 4K"
open_weights = false
release_date = "2026-08-11"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
