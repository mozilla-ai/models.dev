# ShengShu Technology's Vidu Q1, released 2025-04-21: https://cgworld.jp/flashnews/01-202505-Vidu-Q1.html
# 1080p at 24 fps: https://platform.vidu.com/docs/overview/model-map
# Inputs: text plus start and end frame images. ShengShu's docs name no image or video formats,
#   so the generic entries are kept.
schema = 2
v2_only = true
type = "video"
name = "Vidu Q1"
description = "1080p video model for text, image and first-to-last frame generation"
open_weights = false
release_date = "2025-04-21"

[modalities]
input = ["text", "image"]
output = ["video"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
