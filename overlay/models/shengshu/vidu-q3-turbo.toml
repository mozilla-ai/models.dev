# ShengShu Technology's Vidu Q3 Turbo (API id viduq3-turbo: https://platform.vidu.com/docs/overview/model-map),
#   the speed-optimized Q3 variant. Release date 2026-02-20 per https://developer.puter.com/ai/vidu/vidu-q3-turbo/
#   (ShengShu names no date).
# Up to 16 s of 1080p video at 24 fps with native audio; text, image, start and end frame, and reference to video:
#   https://www.together.ai/models/vidu-q3-turbo. ShengShu names no input formats.
schema = 2
v2_only = true
type = "video"
name = "Vidu Q3 Turbo"
description = "Faster Vidu Q3 video model with native audio for text, image, start-end frame and reference to video"
open_weights = false
release_date = "2026-02-20"

[modalities]
input = ["text", "image"]
output = ["video"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
