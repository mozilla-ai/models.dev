# Sources (accessed 2026-11-11):
#   https://docs.mistral.ai/models/voxtral-mini-transcribe-3-0 (Voxtral Mini Transcribe 3, API ID
#     voxtral-mini-transcribe-3-0, released 2026-10-20, POST /v1/audio/transcriptions)
#   GET https://api.mistral.ai/v1/models (voxtral-mini-transcribe-3, alias voxtral-mini-transcribe-3-0;
#     capability audio_transcription, offline mode, diarization and context bias)
# No weights on https://huggingface.co/mistralai and none named in the docs, so open_weights = false.
# Input formats ("Supported formats: WAV, MP3, FLAC, OGG, WEBM"): https://docs.mistral.ai/resources/known-limitations
schema = 2
v2_only = true
type = "transcription"
name = "Voxtral Mini Transcribe 3"
description = "Fast speech-to-text model with diarization for high-volume transcription"
family = "voxtral"
open_weights = false
release_date = "2026-10-20"

[modalities]
input = ["audio/wav", "audio/mpeg", "audio/flac", "audio/ogg", "audio/webm"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
