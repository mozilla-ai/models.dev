# Sources (accessed 2026-11-11):
#   https://docs.mistral.ai/models/voxtral-mini-tts-3-0 (Voxtral TTS 3, API ID voxtral-mini-tts-3-0, released
#     2026-10-20, POST /v1/audio/speech; replaces Voxtral TTS 26.03, deprecated 2026-10-31)
#   GET https://api.mistral.ai/v1/models (voxtral-mini-tts-3, alias voxtral-mini-tts-3-0; capability audio_speech,
#     offline and realtime modes, response_formats pcm|wav|mp3|flac|opus)
# No weights on https://huggingface.co/mistralai and none named in the docs, so open_weights = false.
schema = 2
v2_only = true
type = "speech"
name = "Voxtral Mini TTS 3"
description = "Multilingual text-to-speech model with controllable emotion and pace"
family = "voxtral"
open_weights = false
release_date = "2026-10-20"

[modalities]
input = ["text"]
output = ["audio/pcm", "audio/wav", "audio/mpeg", "audio/flac", "audio/opus"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
