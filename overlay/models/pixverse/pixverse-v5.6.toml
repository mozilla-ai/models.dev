# Released 2026-01-26: https://developer.puter.com/ai/pixverse/pixverse-v5.6/ and
#   https://www.atlascloud.ai/blog/guides/pixverse-v5 (PixVerse's own posts name no date).
# 360p to 1080p, 5, 8 or 10 s (1080p up to 8 s), first and last frame input, optional synchronized audio
#   (Puter page above; https://www.together.ai/models/pixverse-v5-6). PixVerse names no input formats.
schema = 2
v2_only = true
type = "video"
name = "PixVerse V5.6"
description = "Video model for text and image to video with first and last frames and optional synchronized audio"
open_weights = false
release_date = "2026-01-26"

[modalities]
input = ["text", "image"]
output = ["video"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
