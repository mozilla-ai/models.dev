# Tencent Cloud TokenHub (international site). Model row: Kling-Image-v3-omni (kling-image-v3-omni)
# Pricing: https://www.tencentcloud.com/document/product/1300/78937 (Image Generation table: USD 1.6 per 1M tokens and a fixed token count per unit; the table's
#   "reference cost" per unit is recorded; no region tabs), accessed 2026-11-18. Not probed live.
# 1K and 2K: $0.028 per image; 4K: $0.056.
# Cost condition: resolution is the API's own value ("1k", "2k", "4k").
# API: Kling Image Generation API Guide, https://www.tencentcloud.com/document/product/1300/85048 (accessed 2026-11-18). sdk "none": the request format is Tencent's own.
schema = 2
v2_only = true
base_model = "kuaishou/kling-image-v3.0-omni"

[api.images]
path = "/wand/kling-image/generation"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.image.output]
unit = "image"
price = 0.028

[[cost.image.output.overrides]]
when = { resolution = { equals = "4k" } }
price = 0.056
