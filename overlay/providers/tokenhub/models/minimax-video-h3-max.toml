# Tencent Cloud TokenHub (international site). Model row: MiniMax-Video-H3-Max (minimax-video-h3-max)
# Pricing: https://www.tencentcloud.com/document/product/1300/78937 (Video Generation table: USD 1.6 per 1M tokens and a fixed token count per unit; the table's
#   "reference cost" per unit is recorded; no region tabs), accessed 2026-11-18. Not probed live.
# 480P: $0.05 per second; 768P: $0.08.
# Cost condition: resolution is the API's own value ("480P" or "768P"; it is required and has no default).
# API: MiniMax Video Generation API Guide, https://www.tencentcloud.com/document/product/1300/83715 (accessed 2026-11-18). sdk "none": the request format is Tencent's own.
schema = 2
v2_only = true
base_model = "minimax/MiniMax-H3-Max"

[api.videos]
path = "/wand/minimax-video-v2/generation"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.05

[[cost.video.output.overrides]]
when = { resolution = { equals = "768P" } }
price = 0.08
