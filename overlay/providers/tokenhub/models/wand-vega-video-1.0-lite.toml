# Tencent Cloud TokenHub (international site). No row in the model list (https://www.tencentcloud.com/document/product/1300/78934); it has an API guide.
# No cost: https://www.tencentcloud.com/document/product/1300/78937 has no row for it (accessed 2026-11-18). The China site lists CNY prices for it, but that is
#   another price list with other token counts, so they are not used.
# API: WAND Video Generation API Guide, https://www.tencentcloud.com/document/product/1300/84930 (accessed 2026-11-18). sdk "none": the request format is Tencent's own.
schema = 2
v2_only = true
base_model = "tencent/wand-vega-video-1.0-lite"

[api.videos]
path = "/wand/vega-videos/tasks"
sdk = { aisdk = "none", opencodeai = "none" }
