# Tencent Cloud TokenHub (international site). Model row: GLM-5.3-FlashX (glm-5.3-flashx)
# Pricing: https://www.tencentcloud.com/document/product/1300/78937 (Singapore tab, USD per 1M tokens, list price), accessed 2026-11-18.
# The Guangzhou tab lists other prices: they are the region = "ap-guangzhou" overrides.
# Limits and capabilities: https://www.tencentcloud.com/document/product/1300/78934 (accessed 2026-11-18). Not probed live.
# FlashX is a faster serving option of GLM-5.3-Flash; name, description and date as providers/zhipuai/models/glm-5.3-flashx.toml.
# Controls as providers/zhipuai/models/glm-5.3-flashx.toml: reasoning_effort = low|high|max.
schema = 2
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3-FlashX"
description = "High-speed GLM-5.3-Flash serving option for coding and agent workflows"
release_date = "2026-09-18"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
top_k = false
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.37
cache = { read = 0.075 }

[[cost.text.input.overrides]]
when = { region = { equals = "ap-guangzhou" } }
price = 0.28
cache = { read = 0.079 }

[cost.text.output]
price = 1.25

[[cost.text.output.overrides]]
when = { region = { equals = "ap-guangzhou" } }
price = 0.97
