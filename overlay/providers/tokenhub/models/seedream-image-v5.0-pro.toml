# Tencent Cloud TokenHub (international site). Model row: Seedream-Image-v5.0-pro (seedream-image-v5.0-pro)
# Pricing: https://www.tencentcloud.com/document/product/1300/78937 (Image Generation table: USD 1.6 per 1M tokens and a fixed token count per unit; the table's
#   "reference cost" per unit is recorded; no region tabs), accessed 2026-11-18. Not probed live.
# Output up to 2.61 megapixels: $0.045 per image; above: $0.09. The API takes size as a tier (1K, 1.5K, 2K) or as pixels.
# Not recorded: the first input image is free, each more costs $0.003.
# API: Seedream Image Generation API Guide, https://www.tencentcloud.com/document/product/1300/83710 (accessed 2026-11-18). sdk "none": the request format is Tencent's own.
schema = 2
v2_only = true
base_model = "bytedance-seed/seedream-5.0-pro"

[api.images]
path = "/wand/si-image/generation"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.image.output]
unit = "image"
price = 0.045

[[cost.image.output.overrides]]
when = { megapixels = { gt = 2.61 } }
price = 0.09
