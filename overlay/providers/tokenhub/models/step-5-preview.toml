# Tencent Cloud TokenHub (international site). Model row: Step 5 Preview (step-5-preview)
# Pricing: https://www.tencentcloud.com/document/product/1300/78937 (Singapore tab, USD per 1M tokens, list price), accessed 2026-11-18.
# The Guangzhou tab lists other prices: they are the region = "ap-guangzhou" overrides.
# Limits and capabilities: https://www.tencentcloud.com/document/product/1300/78934 (accessed 2026-11-18). Not probed live.
# Output limit: the model list gives 64k.
# Controls as the lab's own host (providers/stepfun/models/step-5-preview.toml): reasoning_effort = low|medium|high.
schema = 2
base_model = "stepfun/step-5-preview"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
cache = { implicit = true }

[limit]
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1
cache = { read = 0.05 }

[[cost.text.input.overrides]]
when = { region = { equals = "ap-guangzhou" } }
price = 0.973
cache = { read = 0.049 }

[cost.text.output]
price = 2.7

[[cost.text.output.overrides]]
when = { region = { equals = "ap-guangzhou" } }
price = 2.779
