# mistral-embed-2312: GET https://api.mistral.ai/v1/models (accessed 2026-11-11) lists it with billing_model_name
#   "mistral-embed", the same as mistral-embed. The rest of this file is a copy of
#   providers/mistral/models/mistral-embed.toml, whose notes below were written for mistral-embed.
# Model: https://docs.mistral.ai/models/mistral-embed-23-12 (embedding model on POST /v1/embeddings; API IDs
# mistral-embed-2312, mistral-embed; $0.1 per MTok input).
# API: POST https://api.mistral.ai/v1/embeddings (https://docs.mistral.ai/api/endpoint/embeddings).
schema = 2
type = "embedding"
name = "Mistral Embed"
description = "Embedding model for semantic search, retrieval, clustering, and ranking pipelines"
family = "mistral-embed"
open_weights = false
release_date = "2023-12-11"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_000
output = 3_072

[api.embeddings]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/embeddings" }

[cost.text.input]
price = 0.1

[cost.text.output]
price = 0
