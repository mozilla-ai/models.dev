# Sources:
#   https://docs.mistral.ai/models/voxtral-tts-26-03 (Voxtral TTS, API IDs voxtral-mini-tts-2603 and
#     voxtral-mini-tts-latest, released 2026-03-23; open weights under CC BY-NC 4.0 at
#     https://huggingface.co/mistralai/Voxtral-4B-TTS-2603; $16 per 1M input characters)
#   https://docs.mistral.ai/studio/audio/text_to_speech/speech (POST /v1/audio/speech; response_format
#     pcm|wav|mp3|flac|opus, default mp3; a 2-3 second reference audio clip can clone a voice)
#   https://mistral.ai/news/voxtral-tts
# Cost (accessed 2026-11-11): "$0.016 per 1k characters" of input text, from https://mistral.ai/news/voxtral-tts.
#   docs.mistral.ai/inference/pricing no longer lists this model: its model page marks it deprecated on
#   2026-10-31, with Voxtral TTS 3 as the replacement. GET /v1/models still serves it (voxtral-mini-tts-2603,
#   alias voxtral-mini-tts-latest, billing_model_name voxtral-mini-tts-2603), and OpenRouter's Mistral route
#   bills it at $16 per 1M prompt characters. v1 shows no cost: a per-character price has no per-token pair.
# API: POST https://api.mistral.ai/v1/audio/speech (https://docs.mistral.ai/api/endpoint/audio/speech).
schema = 2
type = "speech"
name = "Voxtral Mini TTS (latest)"
description = "Multilingual text-to-speech model with zero-shot voice cloning"
family = "voxtral"
open_weights = true
release_date = "2026-03-23"

[modalities]
input = ["text"]
output = ["audio/pcm", "audio/wav", "audio/mpeg", "audio/flac", "audio/opus"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false

[limit]
context = 0
output = 0

[api.speech]
sdk = { opencodeai = "none" }

[cost.text.input]
unit = "character"
price = 16
