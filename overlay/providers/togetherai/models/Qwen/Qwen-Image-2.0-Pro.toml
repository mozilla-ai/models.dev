# Source: https://www.together.ai/models/qwen-image-20-pro and https://docs.together.ai/docs/serverless-models#image-models (accessed 2026-10-29).
# $0.075 per image per the docs catalog (the pricing page shows $0.08). Billed per image at the upstream provider's own charge; the price is Together's estimate and varies with resolution, quality and reference images (https://docs.together.ai/docs/serverless/overview#how-image-models-bill).
# Images: POST https://api.together.xyz/v1/images/generations; input images go in image_url or reference_images
# (https://docs.together.ai/reference/post-images-generations).
schema = 2
v2_only = true
base_model = "alibaba/qwen-image-2.0-pro"

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/togetherai/images" }

[cost.image.output]
unit = "image"
price = 0.075
