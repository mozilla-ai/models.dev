# Source: https://www.together.ai/models/flux1-1-pro and https://docs.together.ai/docs/serverless-models#image-models (accessed 2026-10-29).
# $0.04 per megapixel. Billed per output megapixel (https://docs.together.ai/docs/serverless-models#per-megapixel-cost-formula).
# Images: POST https://api.together.xyz/v1/images/generations; input images go in image_url or reference_images
# (https://docs.together.ai/reference/post-images-generations).
schema = 2
v2_only = true
base_model = "black-forest-labs/flux-1.1-pro"

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/togetherai/images" }

[cost.image.output]
unit = "megapixel"
price = 0.04
