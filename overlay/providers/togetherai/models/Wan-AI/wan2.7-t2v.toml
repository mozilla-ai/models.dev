# Source: https://www.alibabacloud.com/help/en/model-studio/wan2-7-t2v, GET /v1/models and
# https://docs.together.ai/docs/serverless/overview (accessed 2026-11-11).
# Unit: "Video generation: Per second of output" (serverless overview). The pricing page's "Price per video"
# header does not match. GET /v1/models gives $0.10 "per 5 seconds of video"; the billing check below shows
# Together charges Alibaba's rate instead: 720P $0.10, 1080P $0.15 per second.
# Text-to-video, 2-15 s, 720p or 1080p.
# API: async POST https://api.together.ai/v2/videos, then poll: https://docs.together.ai/docs/inference/videos/overview
# Live (2026-11-11): job 01a1cacf-b6d6-7bc3-a455-346cc6d1ffda, 2 s at 720P with audio, billed $0.20
# (2 s x $0.10) on the account's cost-analytics page.
schema = 2
v2_only = true
base_model = "alibaba/wan2.7"

[api.videos]
base_url = "https://api.together.ai/v2"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.1

[[cost.video.output.overrides]]
when = { resolution = { equals = "1080p" } }
price = 0.15
