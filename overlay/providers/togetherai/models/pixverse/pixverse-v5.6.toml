# Source: https://www.together.ai/pricing and https://docs.together.ai/docs/serverless-models#video-models (accessed 2026-11-11).
# Price: $0.1326 per video (GET /v1/models: "$0.1031 - $0.221 per 5 sec video without audio. Audio is an additional $0.1326").
# API: async POST https://api.together.ai/v2/videos, then poll: https://docs.together.ai/docs/inference/videos/overview
# No [cost]: the docs and pricing page give a flat "price per video", but GET /v1/models describes some of these
# prices per second or per 5 seconds, so the unit is unclear. The schema has no per-video unit.
# Not probed (a video costs $0.05 to $0.57).
schema = 2
v2_only = true
base_model = "pixverse/pixverse-v5.6"

[api.videos]
base_url = "https://api.together.ai/v2"
sdk = { aisdk = "none", opencodeai = "none" }
