# Source: https://www.together.ai/pricing, https://www.together.ai/models/minimax-m3-1-flash and
# https://docs.together.ai/docs/serverless-models (accessed 2026-10-29).
# Serverless: $0.15 input, $0.015 cached input, $0.60 output per 1M; context 1,048,576; function
# calling and structured outputs: yes. US-only inference (us-api.together.ai) costs 25% more.
# Effort: reasoning_effort = low|medium|high|xhigh|max (model page). Not probed.
# Inputs: text, image and video (model page); the types are the lab's.
# Replaces MiniMaxAI/MiniMax-M3, which Together retires on 2026-11-06
# (https://docs.together.ai/docs/deprecations).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
cache = { implicit = true }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.15
cache = { read = 0.015 }

[cost.text.output]
price = 0.6
