# Source: https://www.together.ai/models/seedream-50-lite and https://docs.together.ai/docs/serverless-models#image-models (accessed 2026-11-11).
# $0.035 per image ("Pricing is $0.035 for both 2K & 3K outputs", GET /v1/models). Billed per image at the upstream provider's own charge; the price is Together's estimate and varies with resolution, quality and reference images (https://docs.together.ai/docs/serverless/overview#how-image-models-bill).
# Up to 4K output and up to 4 images per request; reference images through reference_images (model page).
# Images: POST https://api.together.xyz/v1/images/generations; input images go in image_url or reference_images
# (https://docs.together.ai/reference/post-images-generations).
# Not probed: Together routes this model to a third-party provider, and the test account has third-party data
# sharing off (403, 2026-11-11).
schema = 2
v2_only = true
base_model = "bytedance-seed/seedream-5.0-lite"

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/togetherai/images" }

[cost.image.output]
unit = "image"
price = 0.035
