# Source: https://runware.ai/docs/models/google-veo-3-1, GET /v1/models and
# https://docs.together.ai/docs/serverless/overview (accessed 2026-11-11).
# Unit: "Video generation: Per second of output" (serverless overview). The pricing page's "Price per video"
# header does not match. Together's video backend is Runware (the API's parameter errors list Runware fields).
# GET /v1/models gives "0.08/ per 4s at 720p without audio. .60/s with audio"; the billing check below shows
# Together charges Runware's rate instead: $0.20 per second at 720p / 1080p without audio.
# No audio override: the with-audio rate is not verified.
# API: async POST https://api.together.ai/v2/videos, then poll: https://docs.together.ai/docs/inference/videos/overview
# Live (2026-11-11): job 01a1cacf-b6d7-7bc3-aaa9-bbe08be5ebb4, 4 s at 720p without audio, billed $0.80
# (4 s x $0.20) on the account's cost-analytics page.
schema = 2
v2_only = true
base_model = "google/veo-3.1-generate-preview"

[api.videos]
base_url = "https://api.together.ai/v2"
sdk = { aisdk = "none", opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.2
