# Source: https://www.together.ai/models/gemini-31-flash-lite-image and https://docs.together.ai/docs/serverless-models#image-models (accessed 2026-11-11).
# $0.069 per image per the docs catalog and the pricing page. Billed per image at the upstream provider's own charge; the price is Together's estimate and varies with resolution, quality and reference images (https://docs.together.ai/docs/serverless/overview#how-image-models-bill).
# The images endpoint takes up to 14 reference images (model page), returns images only (no text), and takes no
# sampling parameters. The model page lists minimal and high thinking levels.
# Images: POST https://api.together.xyz/v1/images/generations; input images go in image_url or reference_images
# (https://docs.together.ai/reference/post-images-generations).
# Not probed: Together routes this model to a third-party provider, and the test account has third-party data
# sharing off (403, 2026-11-11).
schema = 2
v2_only = true
base_model = "google/gemini-3.1-flash-lite-image"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/togetherai/images" }

[cost.image.output]
unit = "image"
price = 0.069
