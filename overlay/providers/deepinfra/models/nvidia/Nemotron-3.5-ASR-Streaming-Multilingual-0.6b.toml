# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "automatic-speech-recognition") and
#   https://api.deepinfra.com/models/nvidia/Nemotron-3.5-ASR-Streaming-Multilingual-0.6b; model page https://deepinfra.com/nvidia/Nemotron-3.5-ASR-Streaming-Multilingual-0.6b.
# Price: $0.00000333 per second of audio (0.000333 cents per second, $0.0002 per minute).
# API: POST https://api.deepinfra.com/v1/audio/transcriptions (OpenAI-compatible) or native POST /v1/inference/{model}.

schema = 2
v2_only = true
base_model = "nvidia/nemotron-3.5-asr-streaming-multilingual-0.6b"

[api.transcriptions]
base_url = "https://api.deepinfra.com/v1"
sdk = { opencodeai = "@opencode/ai/protocols/openai-transcription" }

[cost.audio.input]
unit = "second"
price = 0.00000333
