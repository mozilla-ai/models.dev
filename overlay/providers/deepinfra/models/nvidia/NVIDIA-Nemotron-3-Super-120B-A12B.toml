# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B; model page https://deepinfra.com/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B.
# Price: $0.075 input, $0.4 output per 1M tokens (cents_per_input_token / cents_per_output_token).
# Service tiers: priority x1.5, flex x0.8 (rate_per_service_tier_*).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).

schema = 2
base_model = "nvidia/nemotron-3-super-120b-a12b"

[capabilities]
reasoning = { supported = true }
structured_output = true
service_tier = ["priority", "flex"]

[cost.text.input]
price = 0.075

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
