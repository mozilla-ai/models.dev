# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/nvidia/Nemotron-Content-Safety-3.5; model page https://deepinfra.com/nvidia/Nemotron-Content-Safety-3.5.
# Price: $0.2 input, $0.2 output per 1M tokens (cents_per_input_token / cents_per_output_token).
# Service tiers: priority x1.5, flex x0.8 (rate_per_service_tier_*).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).

schema = 2
base_model = "nvidia/nemotron-3.5-content-safety"

[capabilities]
reasoning = { supported = false }
service_tier = ["priority", "flex"]

[limit]
context = 131_072

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.2

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
