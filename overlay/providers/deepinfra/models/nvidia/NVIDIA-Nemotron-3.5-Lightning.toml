# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/nvidia/NVIDIA-Nemotron-3.5-Lightning; model page https://deepinfra.com/nvidia/NVIDIA-Nemotron-3.5-Lightning.
# Price: $0.06 input, $0.16 output per 1M tokens, cache read x0.5 (cents_per_input_token / cents_per_output_token).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).

schema = 2
base_model = "nvidia/nemotron-3.5-lightning"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[cost.text.input]
price = 0.06
cache = { read = 0.03 }

[cost.text.output]
price = 0.16
