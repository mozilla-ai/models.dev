# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/anthropic/claude-opus-5-5; model page https://deepinfra.com/anthropic/claude-opus-5-5.
# Price: $4 input, $20 output per 1M tokens, cache read x0.05 (cents_per_input_token / cents_per_output_token).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).

schema = 2
base_model = "anthropic/claude-opus-5-5"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[cost.text.input]
price = 4
cache = { read = 0.2 }

[cost.text.output]
price = 20
