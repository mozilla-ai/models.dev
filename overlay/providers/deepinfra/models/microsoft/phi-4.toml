# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/microsoft/phi-4; model page https://deepinfra.com/microsoft/phi-4.
# Price: $0.07 input, $0.14 output per 1M tokens (cents_per_input_token / cents_per_output_token).
# Service tiers: flex x0.8 (rate_per_service_tier_*).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).

schema = 2
base_model = "microsoft/phi-4"

[capabilities]
reasoning = { supported = false }
structured_output = true
service_tier = ["flex"]

[cost.text.input]
price = 0.07

[cost.text.output]
price = 0.14

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
