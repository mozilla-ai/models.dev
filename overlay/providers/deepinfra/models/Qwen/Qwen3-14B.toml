# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/Qwen/Qwen3-14B; model page https://deepinfra.com/Qwen/Qwen3-14B.
# Price: $0.12 input, $0.24 output per 1M tokens (cents_per_input_token / cents_per_output_token).
# Service tiers: priority x1.5, flex x0.8 (rate_per_service_tier_*).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning

schema = 2
base_model = "alibaba/qwen3-14b"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
service_tier = ["priority", "flex"]

[limit]
context = 40_960

[cost.text.input]
price = 0.12

[cost.text.output]
price = 0.24

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
