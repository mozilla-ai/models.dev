# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/Qwen/Qwen2.5-72B-Instruct; model page https://deepinfra.com/Qwen/Qwen2.5-72B-Instruct.
# Price: $0.36 input, $0.4 output per 1M tokens (cents_per_input_token / cents_per_output_token).
# Service tiers: flex x0.8 (rate_per_service_tier_*).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).

schema = 2
base_model = "alibaba/qwen2.5-72b-instruct"

[capabilities]
reasoning = { supported = false }
structured_output = true
service_tier = ["flex"]

[limit]
context = 32_768

[cost.text.input]
price = 0.36

[cost.text.output]
price = 0.4

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
