# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-to-speech") and
#   https://api.deepinfra.com/models/inworld-ai/realtime-tts-1.5-max; model page https://deepinfra.com/inworld-ai/realtime-tts-1.5-max.
# Price: $50 per 1M input characters (0.005 cents per character).
# API: POST https://api.deepinfra.com/v1/audio/speech (OpenAI-compatible) or native POST /v1/inference/{model}.

schema = 2
v2_only = true
base_model = "inworld/inworld-tts-1.5-max"

[api.speech]
base_url = "https://api.deepinfra.com/v1"
sdk = { opencodeai = "@opencode/ai/protocols/openai-speech" }

[cost.text.input]
unit = "character"
price = 50
