# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/meta-models/Muse-Glimmer-30B; model page https://deepinfra.com/meta-models/Muse-Glimmer-30B.
# Price: $0.3 input, $1.2 output per 1M tokens, cache read x0.13333333 (cents_per_input_token / cents_per_output_token).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).

schema = 2
base_model = "meta/muse-glimmer-30b"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true

[cost.text.input]
price = 0.3
cache = { read = 0.04 }

[cost.text.output]
price = 1.2
