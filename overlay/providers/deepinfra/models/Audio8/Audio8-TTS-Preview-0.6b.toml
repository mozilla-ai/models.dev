# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-to-speech") and
#   https://api.deepinfra.com/models/Audio8/Audio8-TTS-Preview-0.6b; model page https://deepinfra.com/Audio8/Audio8-TTS-Preview-0.6b.
# Price: $5 per 1M input characters (0.0005 cents per character).
# API: POST https://api.deepinfra.com/v1/audio/speech (OpenAI-compatible) or native POST /v1/inference/{model}.

schema = 2
v2_only = true
base_model = "audio8/audio8-tts-preview-0.6b"

[api.speech]
base_url = "https://api.deepinfra.com/v1"
sdk = { opencodeai = "@opencode/ai/protocols/openai-speech" }

[cost.text.input]
unit = "character"
price = 5
