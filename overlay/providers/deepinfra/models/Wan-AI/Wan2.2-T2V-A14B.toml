# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-to-video") and
#   https://api.deepinfra.com/models/Wan-AI/Wan2.2-T2V-A14B; model page https://deepinfra.com/Wan-AI/Wan2.2-T2V-A14B.
# Price: $0.033 per second of output video (cents_per_output_sec).
# API: POST https://api.deepinfra.com/v1/videos (OpenAI-compatible), then GET /v1/videos/{id} and /content;
#   native POST https://api.deepinfra.com/v1/inference/{model} takes the options named above.

schema = 2
v2_only = true
base_model = "alibaba/wan2.2-t2v-a14b"

[api.videos]
base_url = "https://api.deepinfra.com/v1"
sdk = { opencodeai = "none" }

[cost.video.output]
unit = "second"
price = 0.033
