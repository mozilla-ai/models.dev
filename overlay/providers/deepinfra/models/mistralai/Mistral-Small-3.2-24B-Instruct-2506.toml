# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/mistralai/Mistral-Small-3.2-24B-Instruct-2506; model page https://deepinfra.com/mistralai/Mistral-Small-3.2-24B-Instruct-2506.
# Price: $0.075 input, $0.2 output per 1M tokens (cents_per_input_token / cents_per_output_token).
# Service tiers: priority x1.5, flex x0.8 (rate_per_service_tier_*).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).

schema = 2
base_model = "mistral/mistral-small-3.2-24b-instruct"

[capabilities]
reasoning = { supported = false }
structured_output = true
service_tier = ["priority", "flex"]

[limit]
context = 128_000

[cost.text.input]
price = 0.075

[cost.text.output]
price = 0.2

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
