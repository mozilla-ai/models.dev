# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-to-image") and
#   https://api.deepinfra.com/models/google/nano-banana-2; model page https://deepinfra.com/google/nano-banana-2.
# Price: 0.006 cents per token = $60/M tokens (cents_per_input_token); the page
#   states the per-image token counts: 1120 tokens per input image, with output image costs scaling by resolution: 747 tokens ($0.045) for 512 (roughly 0.25MP), 1120 tokens ($0.067) for 1K (roughly 1MP), 1680 tokens ($0.101) for 2K (roughly 4MP), and 2520 tokens ($0.151) for 4K (roughly 16MP)
#   Here: image output per image by resolution, input images per image, text per 1M tokens.
# API: POST https://api.deepinfra.com/v1/images/generations and /v1/images/edits (OpenAI-compatible),
#   or native POST https://api.deepinfra.com/v1/inference/{model}.
# The image endpoint exposes no reasoning control, so reasoning is off on this route.

schema = 2
v2_only = true
base_model = "google/gemini-3.1-flash-image"

[capabilities]
reasoning = { supported = false }

[api.images]
base_url = "https://api.deepinfra.com/v1"
sdk = { aisdk = "@ai-sdk/deepinfra", opencodeai = "@opencode/ai/providers/deepinfra/images" }

[cost.text.input]
price = 60

[cost.image.input]
unit = "image"
price = 0.0672

[cost.image.output]
unit = "image"
price = 0.067

[[cost.image.output.overrides]]
when = { resolution = { equals = "512" } }
price = 0.045

[[cost.image.output.overrides]]
when = { resolution = { equals = "2K" } }
price = 0.101

[[cost.image.output.overrides]]
when = { resolution = { equals = "4K" } }
price = 0.151
