# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-to-image") and
#   https://api.deepinfra.com/models/google/nano-banana-2-lite; model page https://deepinfra.com/google/nano-banana-2-lite.
# Price: 0.003 cents per token = $30/M tokens (cents_per_input_token); the page
#   states the per-image token counts: 1120 tokens ($0.034) per output image at the single supported 1K resolution (roughly 1MP)
#   Here: image output per image by resolution and input images per image. The text tokens of the prompt
#   ($30/M) are left out: a route priced in two units is one a gateway cannot meter, and the
#   prompt is a small share of an image's cost.
# API: POST https://api.deepinfra.com/v1/images/generations and /v1/images/edits (OpenAI-compatible),
#   or native POST https://api.deepinfra.com/v1/inference/{model}.
# The image endpoint exposes no reasoning control, so reasoning is off on this route.

schema = 2
v2_only = true
base_model = "google/gemini-3.1-flash-lite-image"

[capabilities]
reasoning = { supported = false }

[api.images]
base_url = "https://api.deepinfra.com/v1"
sdk = { aisdk = "@ai-sdk/deepinfra", opencodeai = "@opencode/ai/providers/deepinfra/images" }

[cost.image.output]
unit = "image"
price = 0.034
