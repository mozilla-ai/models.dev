# Catalog (accessed 2026-11-10): https://api.deepinfra.com/models/list (type "text-generation") and
#   https://api.deepinfra.com/models/google/gemma-4-31B-it-turbo; model page https://deepinfra.com/google/gemma-4-31B-it-turbo.
# Price: $0.09 input, $0.34 output per 1M tokens, cache read x0.55555556 (cents_per_input_token / cents_per_output_token).
# Service tiers: priority x1.5, flex x0.8 (rate_per_service_tier_*).
# API: OpenAI-compatible POST https://api.deepinfra.com/v1/openai/chat/completions (provider default).
# Toggle: reasoning.enabled = true|false (reasoning_effort = "none" also disables); https://docs.deepinfra.com/chat/reasoning

schema = 2
base_model = "google/gemma-4-31b-it"

[capabilities]
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { implicit = true }
prompt_cache_key = true
service_tier = ["priority", "flex"]

[cost.text.input]
price = 0.09
cache = { read = 0.05 }

[cost.text.output]
price = 0.34

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.5

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = 0.8
