# OVHcloud AI Endpoints image model: stable-diffusion-xl-base-v10 (SDXL base 1.0)
# Price: "Free" on the catalog page (https://www.ovhcloud.com/en/public-cloud/ai-endpoints/catalog/stable-diffusion-xl/,
#   accessed 2026-11-11). GET /v1/models gives all prices as "0". The price page has no image table.
# API: POST https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/images/generations. A live request returned one
#   1024x1024 PNG as b64_json (2026-11-11). Text to image only.
# Upstream syncs OVHcloud from its OpenRouter feed, which lists chat models only, so it has no file for this model.
schema = 2
v2_only = true
base_model = "stabilityai/stable-diffusion-xl-base-1.0"

[modalities]
input = ["text"]
output = ["image/png"]

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openai-compatible/images" }

[cost.image.output]
unit = "image"
price = 0
