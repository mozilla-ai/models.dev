# Released 2025-06-11 (technical report): https://seed.bytedance.com/en/public_papers/seedance-1-0-exploring-the-boundaries-of-video-generation-models
# Model page: https://seed.bytedance.com/en/seedance. API version seedance-1-0-pro-250528:
#   https://docs.byteplus.com/en/docs/ModelArk/1520757
# Image formats jpeg, png, webp, bmp, tiff, gif: https://www.volcengine.com/docs/82379/1520757
# Output: MP4, silent (sound arrived with Seedance 1.5 Pro).
schema = 2
v2_only = true
type = "video"
name = "Seedance 1.0 Pro"
description = "Video model for multi-shot text-to-video and image-to-video generation up to 1080p"
family = "seed"
open_weights = false
release_date = "2025-06-11"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/bmp", "image/tiff", "image/gif"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[links]]
url = "https://seed.bytedance.com/en/public_papers/seedance-1-0-exploring-the-boundaries-of-video-generation-models"
type = "paper"
